<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlurItOut</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>BlurItOut</h1>
    <p class="tagline">Upload a photo, click anywhere to drop a blur shape, and download the result.</p>
  </header>

  <main class="app-layout">
    <section class="controls-panel">
      <div class="control-group">
        <label for="image-input">1. Choose an image</label>
        <input type="file" id="image-input" accept="image/png, image/jpeg" />
      </div>

      <div class="control-group">
        <label for="shape-type">Shape</label>
        <select id="shape-type">
          <option value="circle">Circle</option>
          <option value="rect">Rectangle</option>
        </select>
      </div>

      <div class="control-group">
        <label for="shape-width">Width: <span id="shape-width-value">80</span>px</label>
        <input type="range" id="shape-width" min="10" max="400" value="80" />
      </div>

      <div class="control-group">
        <label for="shape-height">Height: <span id="shape-height-value">80</span>px</label>
        <input type="range" id="shape-height" min="10" max="400" value="80" />
      </div>

      <div class="control-group">
        <label for="blur-strength">Blur strength: <span id="blur-strength-value">8</span></label>
        <input type="range" id="blur-strength" min="1" max="30" value="8" />
      </div>

      <div class="control-group button-row">
        <button id="undo-shape-btn" type="button">Undo last shape</button>
        <button id="clear-shapes-btn" type="button">Clear all shapes</button>
      </div>

      <div class="control-group">
        <label for="download-format">Download format</label>
        <select id="download-format">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </div>

      <div class="control-group">
        <button id="download-btn" type="button" class="primary-btn">Download image</button>
      </div>

      <p class="hint">Click on the image to place a blur shape at that spot. Adjust the width, height, shape, and blur strength any time — new shapes use the current settings.</p>
    </section>

    <section class="canvas-panel">
      <canvas id="editor-canvas"></canvas>
      <p id="empty-state" class="empty-state">Upload an image to get started.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
